<svg width="620" height="330" viewBox="0 0 620 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <style>
      .label { font-family: 'Segoe UI', Verdana, sans-serif; font-size: 15px; fill: #E2E8F0; font-weight: 600; }
      .pct   { font-family: 'Segoe UI', Verdana, sans-serif; font-size: 13px; fill: #5EEAD4; font-weight: 600; }
      .track { fill: #1E293B; rx: 6; }
    </style>
  </defs>

  <rect width="620" height="330" fill="#0F172A" rx="14"/>

  <!-- Row template: label, track, animated fill bar, percentage -->

  <!-- Java / Spring Boot -->
  <text x="24" y="38" class="label">Java &amp; Spring Boot</text>
  <text x="560" y="38" class="pct" text-anchor="end">92%</text>
  <rect x="24" y="46" width="572" height="12" class="track"/>
  <rect x="24" y="46" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="526" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <!-- React / Frontend -->
  <text x="24" y="88" class="label">React.js / Next.js / TypeScript</text>
  <text x="560" y="88" class="pct" text-anchor="end">88%</text>
  <rect x="24" y="96" width="572" height="12" class="track"/>
  <rect x="24" y="96" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="503" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <!-- KIBO / Oracle ATG Commerce -->
  <text x="24" y="138" class="label">KIBO Commerce &amp; Oracle ATG</text>
  <text x="560" y="138" class="pct" text-anchor="end">95%</text>
  <rect x="24" y="146" width="572" height="12" class="track"/>
  <rect x="24" y="146" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="543" dur="1.6s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <!-- AWS / Cloud -->
  <text x="24" y="188" class="label">AWS / Docker / Kubernetes</text>
  <text x="560" y="188" class="pct" text-anchor="end">85%</text>
  <rect x="24" y="196" width="572" height="12" class="track"/>
  <rect x="24" y="196" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="486" dur="1.6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <!-- APIGEE / Integrations -->
  <text x="24" y="238" class="label">APIGEE &amp; Salesforce Integrations</text>
  <text x="560" y="238" class="pct" text-anchor="end">83%</text>
  <rect x="24" y="246" width="572" height="12" class="track"/>
  <rect x="24" y="246" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="475" dur="1.6s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <!-- Production Support / RCA -->
  <text x="24" y="288" class="label">Production Support &amp; RCA</text>
  <text x="560" y="288" class="pct" text-anchor="end">90%</text>
  <rect x="24" y="296" width="572" height="12" class="track"/>
  <rect x="24" y="296" height="12" rx="6" fill="url(#barGrad)">
    <animate attributeName="width" from="0" to="515" dur="1.6s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
</svg>
